# Tomcat
server:
  port: 9203

# Spring
spring: 
  application:
    # 应用名称
    name: ruoyi-job
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      # nacos用户名和密码
      username: nacos
      password: nacos123
      discovery:
        # 服务注册地址
        server-addr: 192.168.0.200:8848
      config:
        # 配置中心地址
        server-addr: 192.168.0.200:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
